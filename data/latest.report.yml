A_kwDOP1JGW84pJFeb","name":"binaries-darwin-arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":3248057,"digest":"sha256:cb5aab39752c22982d36adc0f3414f100e09402f77d280cc229200df8f571439","download_count":21,"created_at":"2026-10-29T23:28:29Z","updated_at":"2026-10-29T23:28:29Z"},{"id":690247580,"node_id":"RA_kwDOP1JGW84pJFec","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":536,"digest":"sha256:497c83279d296cf4f5333404ed696a94ff6f6c9ce89230386d57fc8f51fe95c3","download_count":214,"created_at":"2026-10-29T23:28:29Z","updated_at":"2026-10-29T23:28:29Z"},{"id":690247576,"node_id":"RA_kwDOP1JGW84pJFeY","name":"status-darwin-amd64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4410176,"digest":"sha256:e1a6f0f9b92cb97f38f7c5ca424e0c3203d91bea972c50519d6720ee51759566","download_count":54,"created_at":"2026-10-29T23:28:29Z","updated_at":"2026-10-29T23:28:29Z"},{"id":690247578,"node_id":"RA_kwDOP1JGW84pJFea","name":"status-darwin-arm64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4268290,"digest":"sha256:7120bd328e63aea18e31adef065bc64516f117c0d81d7719c8118f2c9e396957","download_count":165,"created_at":"2026-10-29T23:28:29Z","updated_at":"2026-10-29T23:28:29Z"}],"body":"<div align=\"center\">\n  <img src=\"https://cdn.tw93.fun/pic/cole.png\" alt=\"Mole Logo\" width=\"120\" height=\"120\" style=\"border-radius:50%\" />\n  <h1 style=\"margin: 12px 0 6px;\">Mole</h1>\n  <p><em>Deep clean and optimize your Mac.</em></p>\n</div>\n\n### Changelog\n\n1. Reclaim space from idle simulators: `mo clean` now removes the downloaded assets, log stores, caches and lock-screen poster store of shut-down iOS simulators, which can add up to tens of gigabytes, and still waits while any simulator is running.\n2. npx and pnpm dlx packages stay installed: Cleanup keeps the packages npx and `pnpm dlx` install, so commands that are running or reuse them no longer lose their modules, while pnpm's rebuildable metadata is still cleaned.\n3. Safer uv and Bun cleanup: Mole clears these caches only through uv and bun themselves, keeps the cache when that command fails, removes it directly only after confirming no uv or bun process runs, and no longer waits 20 seconds when a running uvx holds the uv cache lock.\n4. Faster cleanup with large project folders: The project cache scan starts in the background before the first section, which cut a dry run from 33.6s to 27.6s on one Mac.\n5. Vesktop caches: Cleanup now reaches Vesktop's HTTP and code caches, close to 1 GB on one Mac, and keeps them while Vesktop runs.\n6. Debug runs read correctly: `mo purge --debug` no longer keeps every `node_modules` as \"Could not inspect\" and reports the run as incomplete.\n7. Cleaner progress next to Homebrew: The spinner no longer runs into Homebrew's output.\n\n### 更新日志\n\n1. 清理闲置模拟器的空间：`mo clean` 会清理已关机 iOS 模拟器下载的资源、日志库、缓存和锁屏海报库，加起来可能有几十 GB，任何模拟器在运行时仍会等待。\n2. npx 和 pnpm dlx 装的包不再被清掉：清理会保留 npx 和 `pnpm dlx` 安装的包，正在运行或会复用它们的命令不再丢失依赖，pnpm 可重建的元数据照常清理。\n3. uv 和 Bun 的清理更稳：Mole 只通过 uv 和 bun 自己的命令清理这两个缓存，命令失败时保留缓存，只有确认没有 uv 或 bun 进程在跑才会直接删除，运行中的 uvx 占着 uv 缓存锁时也不再干等 20 秒。\n4. 项目文件夹很大时清理更快：项目缓存扫描在第一项清理开始前就在后台启动，在一台 Mac 上 dry run 从 33.6 秒降到 27.6 秒。\n5. Vesktop 缓存：清理会覆盖 Vesktop 的 HTTP 和代码缓存，一台 Mac 上接近 1 GB，Vesktop 运行时保留。\n6. 调试模式结果正确：`mo purge --debug` 不再把每个 `node_modules` 都标成 \"Could not inspect\" 并把这次运行判为未完成。\n7. 和 Homebrew 输出不再打架：进度动画不会再和 Homebrew 的输出叠在一起。\n\n### Thanks\n\nIssue reporters and PR contributors this cycle: @stickerdaniel · @r266-tech · @hawkff · @sebastianbreguel.\n\n### Mole Mac App\n\nIf you would rather work in a window than a terminal, [Mole Mac App](https://mole.fit/) covers cleaning, app removal, maintenance, disk analysis and live status, shows everything before it deletes, and adds tools in the menu bar. It costs $19 once, with free updates and a 14-day refund, and you can [download it here](https://mole.fit/download). The CLI stays free and open source.\n","reactions":{"total_count":9,"+1":4,"-1":0,"laugh":1,"hooray":1,"confused":0,"heart":1,"rocket":1,"eyes":1},"mentions_count":4}
