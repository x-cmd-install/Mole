"RA_kwDOP1JGW84vsuv8","name":"binaries-darwin-arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":3319328,"digest":"sha256:d1f1dc554a6e525cecf1eb0f7d41be7559a4b827b7bd698eb4dc758c9d356b39","download_count":61,"created_at":"2026-11-27T11:39:12Z","updated_at":"2026-11-27T11:39:12Z"},{"id":800254983,"node_id":"RA_kwDOP1JGW84vsuwH","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":536,"digest":"sha256:90b7a8b785ad744eebb5a2506c01063990da219d2a69436fc4f6c6b122cfeae1","download_count":737,"created_at":"2026-11-27T11:39:12Z","updated_at":"2026-11-27T11:39:12Z"},{"id":800254989,"node_id":"RA_kwDOP1JGW84vsuwN","name":"status-darwin-amd64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4414288,"digest":"sha256:8dd3cfab8404b272bbc47db8351b8a689418fed640ce6245fbed62b83bc481d2","download_count":198,"created_at":"2026-11-27T11:39:12Z","updated_at":"2026-11-27T11:39:13Z"},{"id":800254971,"node_id":"RA_kwDOP1JGW84vsuv7","name":"status-darwin-arm64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4285602,"digest":"sha256:211072093ac1e0472fad1ecfcff40190ce11ea0a0e23217566ad8c3b8024b056","download_count":545,"created_at":"2026-11-27T11:39:12Z","updated_at":"2026-11-27T11:39:12Z"}],"body":"<div align=\"center\">\n  <img src=\"https://cdn.tw93.fun/pic/cole.png\" alt=\"Mole Logo\" width=\"120\" height=\"120\" style=\"border-radius:50%\" />\n  <h1 style=\"margin: 12px 0 6px;\">Mole</h1>\n  <p><em>Deep clean and optimize your Mac.</em></p>\n</div>\n\n### Changelog\n\n1. `mo clean` preserves more working data: the SonarScanner truststore and keystore, kubectl credential plugin caches, the AWS CLI credential cache, the Oh My Zsh completions folder and the Homebrew lists zsh completion reads are kept, so sign-ins, company certificates and Tab completion survive a cleanup.\n2. Running apps keep their caches: the caches of a running Chromium browser, its Service Worker stores and the Figma cache are left until the app quits.\n3. Broader cleanup coverage: Cursor, Notion, Figma and Codex desktop caches, old Cursor Agent versions bundled with Cursor, stale update packages, unsaved Instruments traces and browser profiles left behind by Puppeteer are now cleaned.\n4. Accurate totals and tidier output: aged log sweeps and the privileged sweeps of the System section count in the `mo clean` total, each Electron app shows as one row, and items owned by another user are no longer listed.\n5. `mo status` on desktop Macs: system power on a Mac Studio is read from the DC input and refreshes with CPU and memory, and a footer shows the dashboard keys.\n6. `mo update` stops on Ctrl-C: a Homebrew update is interrupted at once instead of running until its time limit.\n7. Other fixes: Esc in `mo analyze` clears a multi-selection before leaving the view, `mo uninstall` displays app names such as WhatsApp without invisible marks and sends Bitdefender VPN to its own uninstaller, the whitelist is saved atomically, and `mo history`, `mo slim` and shell completion run faster.\n\n### 更新日志\n\n1. `mo clean` 保留更多工作数据：保留 SonarScanner 的信任库与密钥库、kubectl 凭据插件缓存、AWS CLI 凭据缓存、Oh My Zsh 的补全目录以及 zsh 补全读取的 Homebrew 列表，清理后登录状态、公司证书和 Tab 补全不受影响。\n2. 运行中的应用保留缓存：Chromium 内核浏览器运行时的缓存、Service Worker 存储以及 Figma 缓存留到应用退出后再清理。\n3. 覆盖更多清理项：新增 Cursor、Notion、Figma 和 Codex 桌面端缓存、Cursor 内置的旧版 Cursor Agent、过期的更新安装包、未保存的 Instruments 录制以及 Puppeteer 遗留的浏览器配置目录。\n4. 总量更准确、输出更简洁：过期日志和系统栏目中需要管理员权限的清理计入 `mo clean` 的总量，每个 Electron 应用合并为一行，属于其他用户的项目不再列出。\n5. `mo status` 支持台式 Mac：Mac Studio 的整机功耗改为读取直流输入并随 CPU 和内存一同刷新，底部新增按键提示。\n6. `mo update` 响应 Ctrl-C：通过 Homebrew 更新时按下 Ctrl-C 立即停止，不再等到超时。\n7. 其他修复：`mo analyze` 中按 Esc 会先取消多选再退出当前视图，`mo uninstall` 显示 WhatsApp 等应用名称时不再带不可见字符并把 Bitdefender VPN 交给其自带的卸载程序，白名单改为原子写入，`mo history`、`mo slim` 和命令补全的速度有所提升。\n\n### Thanks\n\nIssue reporters and PR contributors this cycle: @Yuxin-Qiao · @viniciusdsandrade · @po-et · @sebastianbreguel · @thejesh23 · @PeterNiu7403 · @r266-tech · @ndminhvn · @oranshea · @Icecreambobcat · @yuluo-yx · @SergoGansta777.\n\n### Mole Mac App\n\nIf you would rather work in a window than a terminal, [Mole Mac App](https://mole.fit/) covers cleaning, app removal, maintenance, disk analysis and live status, shows everything before it deletes, and adds tools in the menu bar. It costs $19 once, with free updates and a 14-day refund, and you can [download it here](https://mole.fit/download). The CLI stays free and open source.\n","reactions":{"total_count":8,"+1":2,"-1":0,"laugh":1,"hooray":1,"confused":0,"heart":1,"rocket":2,"eyes":1},"mentions_count":12}
